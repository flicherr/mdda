[project]
name = "module-declaration-dependency-analysis"
version = "0.4.0"
description = "Reproducible experiment harness for declaration dependency analysis in C++20 modules"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Module Declaration Dependency Analysis contributors" }]
dependencies = []

[project.scripts]
orchestrator = "orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
